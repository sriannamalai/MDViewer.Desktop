[package]
name = "mdviewer-desktop"
version = "0.1.0"
edition = "2024"

[lib]
name = "mdviewer_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Locates the MSVC toolchain (dumpbin.exe/lib.exe) to synthesize an import
# library for the vendored libmdviewer.dll on Windows — see build.rs.
cc = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

[profile.release]
strip = true
